name: CI
permissions:
  contents: read
  security-events: write # for uploading SARIF results

on:
  push:
    branches: [trunk]
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Install dependencies
        run: npm ci

      - name: Run tsc
        run: mise run typecheck

  test:
    name: Vitest Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the Flakiness.io reporter upload via GitHub OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: mise run test -- --coverage

      # - name: Upload coverage to Coveralls
      #   uses: coverallsapp/github-action@v2

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Install dependencies
        run: npm ci

      - name: Run oxlint
        run: mise run lint

      - name: Run oxlint for code scanning
        run: ./node_modules/.bin/oxlint --format sarif modules/ e2e/ playwright.config.ts vitest.config.ts > oxlint-results.sarif
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: oxlint-results.sarif
          wait-for-processing: true

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: mise run format-check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Install dependencies
        run: npm ci

      - name: Build
        working-directory: modules/gob-web
        run: mise run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-build
          path: ./modules/gob-web/build

  e2e:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the Flakiness.io reporter upload via GitHub OIDC
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      FLAKINESS_TITLE: Playwright (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's ${{ matrix.browser }}
        run: ./node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}

      - name: Build and run the end-to-end tests
        run: mise run e2e -- --project=${{ matrix.browser }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14
