name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:

jobs:
  flow:
    name: Flow Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: npm ci

      - name: Run Flow
        run: node --run flow check --quiet

  test:
    name: Jest Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node --run test --runInBand --coverage

      # - name: Upload coverage to Coveralls
      #   uses: coverallsapp/github-action@v2

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: node --run lint

  format:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: |
          node --run pretty
          git diff --exit-code

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: npm ci

      - name: Build
        working-directory: modules/gob-web
        run: node --run build

      - name: Rearrange files
        run: node scripts/rearrange-for-circle.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: ./modules/gob-web/build
