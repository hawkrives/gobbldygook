[tools]
node = "24"

[tasks]
"build" = { dir = "{{ config_root }}/modules/gob-web", run = "node --run build" }
"build-dev" = { dir = "{{ config_root }}/modules/gob-web", run = "node --run build-dev" }
"build-peg" = { dir = "{{ config_root }}/modules/gob-hanson-format", run = "node --run build" }
"changeset" = { run = "./node_modules/.bin/changeset", description = "Record a user-facing change for the changelog" }
"check" = { depends = ["lint", "typecheck", "test", "format-check"], description = "Run all code quality checks" }
"e2e" = { depends = ["build"], run = "./node_modules/.bin/playwright test", description = "Build the web app and run the Playwright end-to-end tests" }
"count" = "echo $(fd -e scss | wc -l) files && echo $(fd -e scss | xargs wc -l | gsort | tail -n1) lines"
"cover" = "./node_modules/.bin/jest --coverage && open coverage/index.html"
"lint" = "./node_modules/.bin/oxlint --max-warnings=0 --report-unused-disable-directives modules/ e2e/ playwright.config.ts"
"format" = "./node_modules/.bin/oxfmt '{*,.*,{.circleci,modules,config,scripts,e2e}/**/*}.{js,mjs,ts,tsx,json,scss,yml,yaml,md}'"
"format-check" = "./node_modules/.bin/oxfmt --check '{*,.*,{.circleci,modules,config,scripts,e2e}/**/*}.{js,mjs,ts,tsx,json,scss,yml,yaml,md}'"
"netlify" = "mise run build"
"start" = { dir = "{{ config_root }}/modules/gob-web", run = "node --run start" }
"test" = "./node_modules/.bin/jest"
"typecheck" = { run = "./node_modules/.bin/tsc -p .", description = "Typecheck the TypeScript source" }
